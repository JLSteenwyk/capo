[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capo-agents"
version = "0.1.0"
description = "Claude Code-led coordination of subscription coding agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
calendar = ["google-auth>=2.40,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]
slack = ["slack-bolt>=1.23,<2"]
browser = ["playwright>=1.62,<2"]

[project.scripts]
capo = "capo.cli:main"

[tool.setuptools.packages.find]
include = ["capo*"]
