[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capo-agents"
version = "0.1.0"
description = "Claude Code-led coordination of subscription coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
capo = "capo.cli:main"

[tool.setuptools.packages.find]
include = ["capo*"]
